<body onload="checkAuth(); loadDashboard();">

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>LMS</h2>
    <ul>
      <li class="active">🏠 Dashboard</li>
      <li>📚 Courses</li>
      <li onclick="logout()">🚪 Logout</li>
    </ul>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- TOP BAR -->
    <div class="topbar">
      <h2>Welcome, <span id="user-name"></span></h2>
      <input type="text" placeholder="Search..." />
    </div>

    <!-- STATS -->
    <div class="stats">
      <div class="stat-card">
        <h3>Total Courses</h3>
        <p>3</p>
      </div>
      <div class="stat-card">
        <h3>Enrolled</h3>
        <p id="enroll-count">0</p>
      </div>
      <div class="stat-card">
        <h3>Progress</h3>
        <p>Active</p>
      </div>
    </div>

    <!-- COURSES -->
    <body onload="loadCourses()">
<h2>Welcome, <span id="user-name"></span></h2>

<div id="course-container"></div>

<script src="script.js"></script>

</body>
    <!-- ENROLLED -->
    <h2>Your Courses</h2>
    <div id="enrolled-container" class="course-grid"></div>

  </div>

</div>

<script src="script.js"></script>
</body>
