<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body onload="checkAuth(); loadDashboard();">

<div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>LMS</h2>
        <p>Dashboard</p>
        <p>Courses</p>
        <p>Profile</p>
    </div>

    <!-- MAIN AREA -->
    <div class="main">

        <!-- TOP BAR -->
        <div class="topbar">
            <span>Welcome, <b id="user-name"></b></span>
            <button onclick="logout()">Logout</button>
        </div>

        <!-- COURSES -->
        <h3>All Courses</h3>
        <div id="course-container" class="grid"></div>

        <h3>Your Courses</h3>
        <div id="enrolled-container" class="grid"></div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
