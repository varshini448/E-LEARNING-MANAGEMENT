<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body onload="checkAuth(); loadDashboard();">

<!-- TOP BAR -->
<div class="navbar">
    <h2>LMS Dashboard</h2>
    <div>
        <span>Welcome, <b id="user-name"></b></span>
        <button onclick="logout()">Logout</button>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="main">

    <!-- COURSES -->
    <div class="section">
        <h3>All Courses</h3>
        <div id="course-container" class="grid"></div>
    </div>

    <!-- ENROLLED -->
    <div class="section">
        <h3>Your Courses</h3>
        <div id="enrolled-container" class="grid"></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
